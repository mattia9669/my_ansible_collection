services:
  web:
    image: nginx:alpine
    container_name: site-web
    networks:
      - nextcloud_network
    labels:
      caddy: www3.xxx.com
      caddy.reverse_proxy: "{{upstreams}}"
      caddy.header: /*
      caddy.header.Strict-Transport-Security: '"max-age=15552000;"'
    volumes:
      - /opt/dockge/data/site/:/usr/share/nginx/html:ro
      - /opt/dockge/stacks/site/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

  php:
    image: php:8.2-fpm-alpine
    container_name: site-php
    networks:
      - nextcloud_network
    volumes:
      - /opt/dockge/data/site/:/var/www/html:ro
      - /opt/dockge/stacks/site/php-fpm-www.conf:/usr/local/etc/php-fpm.d/zz-site.conf:ro
    restart: always


networks:
  nextcloud_network:
    external: false
    name: nextcloud_network
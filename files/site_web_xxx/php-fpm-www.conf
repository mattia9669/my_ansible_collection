[global]
; Log erreurs générales
error_log = /proc/self/fd/2
log_level = notice

; Nombre de fichiers ouverts max
rlimit_files = 1024

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Pool configuration: [www]
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[www]
; Écoute sur socket TCP (pour nginx)
listen = 9000

; Permissions socket si tu utilises un socket (non ici)
; listen.owner = www-data
; listen.group = www-data
; listen.mode = 0660

; Utilisateur du processus FPM
user = www-data
group = www-data

; Nombre de processus PHP FPM (ajuste selon charge serveur)
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Logs erreurs PHP-FPM (redirigés vers stdout pour Docker)
catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Limites de taille
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 128M

; Sécurité : restrictions dans /var/www/html
php_admin_value[open_basedir] = /var/www/html:/tmp

; Désactiver fonctions dangereuses (optionnel)
php_admin_value[disable_functions] = exec,passthru,shell_exec,system

; Temps pour attendre un script avant arrêt
request_terminate_timeout = 30
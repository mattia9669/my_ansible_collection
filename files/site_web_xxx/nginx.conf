events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logs limités pour éviter la fuite d'infos
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name www3.xxx.com;

        root /var/www/html;
        index index.php index.html index.htm;

        ###########################################################
        # 🔐 Headers de sécurité recommandés
        ###########################################################
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        ###########################################################
        # ⛔ Protection accès fichiers sensibles / cachés
        ###########################################################
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ⛔ Bloque fichiers backup, config, logs uploadés par erreur
        location ~* \.(bak|config|sql|fla|psd|ini|log|sh|swp|dist)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        ###########################################################
        # 📂 Static files (optimisation + cache long)
        ###########################################################
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        ###########################################################
        # 🌐 Routing : fallback vers index.php (CMS type WordPress)
        ###########################################################
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        ###########################################################
        # ⚙️ PHP handling sécurisé
        ###########################################################
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # ⚠️ Bloque exécution PHP dans /uploads ou autre
            # location ~* ^/uploads/.*\.php$ { deny all; }

            # Timeout protection
            fastcgi_read_timeout 30;
        }

        ###########################################################
        # 🛑 Désactive certains HTTP methods
        ###########################################################
        if ($request_method !~ ^(GET|POST|HEAD)$ ) {
            return 444;
        }

        ###########################################################
        # 🔍 Anti-bots/scans : rate limiting (optionnel)
        ###########################################################
        # limit_req_zone $binary_remote_addr zone=limit:10m rate=10r/s;
        # location / {
        #     limit_req zone=limit burst=20 nodelay;
        #     ...
        # }

        ###########################################################
        # 📄 Error handling
        ###########################################################
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /var/www/html;
        }
    }
}

---
- hosts: all
  become: true
  gather_facts: true
  
  tasks:

##### REDHAT ####

  - name: Update all installed packages using YUM module
    when: ansible_facts['distribution'] == 'Rocky'
    yum:
      name: '*'
      state: latest
      update_cache: yes
      update_only: yes
    register: yum_out
  
  - debug: msg="{{ yum_out }}"
    when: 
      - yum_out is defined
      - ansible_facts['distribution'] == 'Rocky'

  - name: Remove packates not needed anymore
    when: ansible_facts['distribution'] == 'Rocky'
    yum:
      autoremove: yes
    register: yum_out2
  
  - debug: msg="{{ yum_out2 }}"
    when: 
      - yum_out2 is defined
      - ansible_facts['distribution'] == 'Rocky'

##### UBUNTU ####
  
  - name: APT cache update
    when: ansible_facts['distribution'] == 'Ubuntu'
    apt:
      update_cache: true
      cache_valid_time: 3600

  - name: Update all installed packages using APT module
    when: ansible_facts['distribution'] == 'Ubuntu'
    apt:
      name: '*'
      state: latest
      update_cache: yes
      cache_valid_time: 3600
      only_upgrade: yes
    register: aptout
  
  - debug: msg="{{ aptout.stdout_lines }}"
    when: 
      - aptout.stdout_lines is defined
      - ansible_facts['distribution'] == 'Ubuntu'

  - name: Remove packages not needed anymore
    when: ansible_facts['distribution'] == 'Ubuntu'
    apt:
      autoremove: yes
    register: aptout2
  
  - debug: msg="{{ aptout2.stdout_lines }}"
    when: 
      - aptout2.stdout_lines is defined
      - ansible_facts['distribution'] == 'Ubuntu'

##### DEBIAN ####
  
  - name: APT cache update
    when: ansible_facts['distribution'] == 'Debian'
    apt:
      update_cache: true
      cache_valid_time: 3600

  - name: Update all installed packages using APT module
    when: ansible_facts['distribution'] == 'Debian'
    apt:
      name: '*'
      state: latest
      update_cache: yes
      cache_valid_time: 3600
      only_upgrade: yes
    register: aptout
  
  - debug: msg="{{ aptout.stdout_lines }}"
    when: 
      - aptout.stdout_lines is defined
      - ansible_facts['distribution'] == 'Debian'

  - name: Remove packages not needed anymore
    when: ansible_facts['distribution'] == 'Debian'
    apt:
      autoremove: yes
    register: aptout2
  
  - debug: msg="{{ aptout2.stdout_lines }}"
    when: 
      - aptout2.stdout_lines is defined
      - ansible_facts['distribution'] == 'Debian'
